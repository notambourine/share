version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: cron
      cronjob: "0 9 * * 1-5"
      timezone: America/Chicago
    open-pull-requests-limit: 10
    cooldown:
      default-days: 2
      semver-major-days: 5
    groups:
      minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      security:
        applies-to: security-updates
        patterns:
          - "*"
    # majors match no group -> individual PRs
  # upstream/brand-kit -> notambourine/brand-kit, the golden set. The bump
  # PR is the whole update: src/brand.ts imports the stylesheets out of the
  # submodule, so moving the pin moves the bytes and CI checks the contract.
  #
  # No cooldown and a daily interval, unlike the npm and actions blocks above.
  # Those wait out a supply-chain window on code from strangers. This is a repo
  # we own, and a brand correction is worth nothing sitting in a queue.
  - package-ecosystem: gitsubmodule
    directory: /
    schedule:
      interval: daily
      time: "09:00"
      timezone: America/Chicago
    open-pull-requests-limit: 1

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: cron
      cronjob: "0 9 * * 1-5"
      timezone: America/Chicago
    cooldown:
      default-days: 2
    groups:
      actions:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      security:
        applies-to: security-updates
        patterns:
          - "*"
