version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: cron
      cronjob: "0 9 * * 1-5"
      timezone: America/Chicago
    open-pull-requests-limit: 10
    cooldown:
      default-days: 2
      semver-major-days: 5
    groups:
      minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      security:
        applies-to: security-updates
        patterns:
          - "*"
    # majors match no group -> individual PRs
  # No gitsubmodule block: upstream/brand-kit is bumped by
  # .github/workflows/brand-pin.yml instead. Dependabot's updater went quiet
  # here after the submodule was repointed and reported that silence as a
  # successful run, which is not a failure mode a brand pin can afford.

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: cron
      cronjob: "0 9 * * 1-5"
      timezone: America/Chicago
    cooldown:
      default-days: 2
    groups:
      actions:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      security:
        applies-to: security-updates
        patterns:
          - "*"
