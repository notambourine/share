name: CI

# Deploys ride Cloudflare Workers Builds on push to `main`, which does not run the
# suite. Without this file a red test reaches production.

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    # The windows and macos legs exist for bin/share.ts: employees run the CLI
    # and the session cache on those boxes, and only a real runner proves the
    # fs paths. ubuntu stays as the cheapest fast-feedback leg.
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # Steady state is 52s on the slowest leg (windows). The cap is set well above
    # that for the cold-cache case: three OS legs, and setup-node's cache misses
    # on every lockfile change, which is when a run is slowest.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      # --ignore-scripts: the first install in this repo's CI, so no lifecycle
      # script gets a runner. vitest, tsc, and oxlint need none; the esbuild and
      # workerd binaries are only used by `npm run vendor` and deploys.
      #
      # Deliberately NOT wrapped in `sfw`. Nothing in this job is worth
      # exfiltrating: no step passes `env:`, the workflow grant is
      # `contents: read`, the checkout drops the token, and the repo is public.
      # Wrap it if a step here ever gains a secret.
      - run: npm ci --ignore-scripts

      - run: npm run oxlint

      - run: npm test

      - run: npm run types

      # The deploy runs this too, and all of its output is gitignored, so a break
      # here would otherwise surface as 404s on the page scripts and a bare
      # favicon after a merge. Works under --ignore-scripts: esbuild's native
      # binary ships inside its platform package rather than being fetched by a
      # postinstall.
      - run: npm run build:client

      # The brand contract, and the gate on a @notambourine/brand-kit bump PR:
      # public/fonts/ and public/logo/ hold what the kit ships file for file,
      # every color is one it defines, and every var() reads a token it still
      # declares. After build:client, which is what writes those two directories.
      # ubuntu only - the hashes would trip on CRLF if the windows runner
      # rewrote a text file.
      - run: npm run brand
        if: matrix.os == 'ubuntu-latest'

  # The rule and its reasoning live in scripts/plugin-version.sh, which the
  # PreToolUse hook in .claude/settings.json also runs before a `git push`. This
  # job is the authoritative copy: the hook only covers a Claude session.
  plugin-version:
    if: github.event_name == 'pull_request'
    # ubuntu-slim: the gate only shells out to git, jq, and sed, all on slim's
    # image, and finishes inside the first billed minute at a third the rate. It
    # is called directly rather than through npm, which slim does not carry.
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The base branch has to be a real ref to diff against.
          fetch-depth: 0

      # GITHUB_BASE_REF is already the base branch on a pull_request, and the
      # script reads it, so nothing interpolates into the shell here.
      - run: ./scripts/plugin-version.sh
