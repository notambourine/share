name: CI

# Deploys ride Cloudflare Workers Builds on push to `main`, which does not run the
# suite. Without this file a red test reaches production.

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    # The windows and macos legs exist for bin/share.mjs: employees run the CLI
    # and the session cache on those boxes, and only a real runner proves the
    # fs paths. ubuntu stays as the cheapest fast-feedback leg.
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      # --ignore-scripts: the first install in this repo's CI, so no lifecycle
      # script gets a runner. vitest, tsc, and oxlint need none; the esbuild and
      # workerd binaries are only used by `npm run vendor` and deploys.
      - run: npm ci --ignore-scripts

      - run: npm run lint

      - run: npm test

      - run: npm run types
