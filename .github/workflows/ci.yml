name: CI

# Deploys ride Cloudflare Workers Builds on push to `main`, which does not run the
# suite. Without this file a red test reaches production.

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    # The windows and macos legs exist for bin/share.ts: employees run the CLI
    # and the session cache on those boxes, and only a real runner proves the
    # fs paths. ubuntu stays as the cheapest fast-feedback leg.
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # Steady state is 52s on the slowest leg (windows). The cap is set well above
    # that for the cold-cache case: three OS legs, and setup-node's cache misses
    # on every lockfile change, which is when a run is slowest.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # upstream/brand-kit holds the brand's golden set. src/brand.ts
          # imports its stylesheets, so without this the suite does not build.
          submodules: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      # --ignore-scripts: the first install in this repo's CI, so no lifecycle
      # script gets a runner. vitest, tsc, and oxlint need none; the esbuild and
      # workerd binaries are only used by `npm run vendor` and deploys.
      #
      # Deliberately NOT wrapped in `sfw`. Nothing in this job is worth
      # exfiltrating: no step passes `env:`, the workflow grant is
      # `contents: read`, the checkout drops the token, and the repo is public.
      # Wrap it if a step here ever gains a secret.
      - run: npm ci --ignore-scripts

      # The brand contract, and the gate on a submodule bump PR: public/fonts/
      # and public/logo/ match the golden set file for file, every color is one
      # it defines, and every var() reads a token it still declares. ubuntu only
      # - the hashes would trip on CRLF if the windows runner rewrote a text file.
      - run: npm run brand
        if: matrix.os == 'ubuntu-latest'

      - run: npm run oxlint

      - run: npm test

      - run: npm run types

      # The deploy runs this too, and the bundles are gitignored, so a break here
      # would otherwise surface as 404s on the page scripts after a merge. Works
      # under --ignore-scripts: esbuild's native binary ships inside its
      # platform package rather than being fetched by a postinstall.
      - run: npm run build:client

  # Claude Code keys a plugin's cache dir by the `version` string in
  # .claude-plugin/plugin.json, not by commit SHA (that fallback applies only to
  # a manifest with no version). An installed 0.1.0 therefore never re-clones
  # while main ships 0.1.0, and every consumer runs a frozen skill. This job is
  # the only thing standing between an edit here and that silent staleness.
  plugin-version:
    if: github.event_name == 'pull_request'
    # ubuntu-slim: this gate only shells out to git, jq, and sed, all on slim's
    # image, and finishes inside the first billed minute at a third the rate.
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The base branch has to be a real ref to diff against.
          fetch-depth: 0

      - env:
          BASE: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$BASE"

          # The installed surface only. src/, public/, and tests/ ride the Worker
          # deploy, which is fresh on every push and needs no bump.
          changed=$(git diff --name-only "origin/$BASE...HEAD" -- skills bin .claude-plugin)
          if [ -z "$changed" ]; then
            echo "no change to the installed surface; no bump needed"
            exit 0
          fi

          old=$(git show "origin/$BASE:.claude-plugin/plugin.json" | jq -r .version)
          new=$(jq -r .version .claude-plugin/plugin.json)

          if [ "$new" = "$old" ]; then
            echo "::error file=.claude-plugin/plugin.json::installed surface changed but version is still $old - bump it"
            printf '%s\n' "$changed" | sed 's/^/  /'
            exit 1
          fi

          # A cache dir is never overwritten, so a version that goes sideways or
          # backwards can land on a name someone already has and stay stale.
          if [ "$(printf '%s\n%s\n' "$old" "$new" | sort -V | tail -1)" != "$new" ]; then
            echo "::error file=.claude-plugin/plugin.json::version must go up: $old -> $new"
            exit 1
          fi

          echo "version $old -> $new"
